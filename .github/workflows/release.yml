name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-arm64
            platform: darwin-arm64
            target: aarch64-apple-darwin
          - os: macos-13
            label: macos-x64
            platform: darwin-x64
            target: x86_64-apple-darwin
          - os: windows-latest
            label: windows-x64
            platform: windows-x64
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            label: linux-x64
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version matches git tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          node scripts/check-version.mjs "$V"

      - name: Set version from package.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: poc/tauri-app/src-tauri

      - name: Install Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Install npm deps
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build:ui

      - name: Build Pi sidecar
        shell: bash
        run: |
          set +e
          bash scripts/build-pi-sidecar.sh "${{ matrix.platform }}" > /tmp/sidecar.out 2>&1
          RC=$?
          cat /tmp/sidecar.out
          {
            echo "## Build Pi sidecar (exit $RC)"
            echo '```'
            tail -60 /tmp/sidecar.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $RC -ne 0 ]; then
            echo "::error::build-pi-sidecar failed (exit $RC)"
          fi
          exit $RC

      - name: Tauri build
        run: npx tauri build --config poc/tauri-app/src-tauri/tauri.conf.json --target "${{ matrix.target }}"

      - name: Collect + rename artifacts
        shell: bash
        run: |
          set -euo pipefail
          V="${VERSION}"
          BUNDLE="poc/tauri-app/src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p dist-artifacts
          case "${{ matrix.label }}" in
            macos-arm64)
              cp "$BUNDLE"/dmg/*.dmg "dist-artifacts/Lattice-v${V}-macos-arm64.dmg"
              ;;
            macos-x64)
              cp "$BUNDLE"/dmg/*.dmg "dist-artifacts/Lattice-v${V}-macos-x64.dmg"
              ;;
            windows-x64)
              cp "$BUNDLE"/nsis/*.exe "dist-artifacts/Lattice-v${V}-windows-x64.exe"
              ;;
            linux-x64)
              cp "$BUNDLE"/appimage/*.AppImage "dist-artifacts/Lattice-v${V}-linux-x64.AppImage"
              cp "$BUNDLE"/deb/*.deb "dist-artifacts/Lattice-v${V}-linux-x64.deb" 2>/dev/null || true
              ;;
          esac
          ls -la dist-artifacts/

      - name: Checksum
        shell: bash
        run: |
          cd dist-artifacts
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS
          else
            shasum -a 256 * > SHA256SUMS
          fi
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: lattice-${{ matrix.label }}
          path: dist-artifacts/*
          if-no-files-found: error

  release:
    name: create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Lattice ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
