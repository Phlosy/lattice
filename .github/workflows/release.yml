name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Repository variable override for future production distribution.
  # Defaults to ad-hoc signing for GitHub/internal desktop releases.
  MACOS_SIGNING_MODE: ${{ vars.MACOS_SIGNING_MODE || 'adhoc' }}

jobs:
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - os: macos-14
            label: macos-apple-silicon
            platform: darwin-arm64
            target: aarch64-apple-darwin
            artifact: macOS-Apple-Silicon
          - os: macos-14
            label: macos-intel
            platform: darwin-x64
            target: x86_64-apple-darwin
            artifact: macOS-Intel
          # Windows x64 (stable)
          - os: windows-latest
            label: windows-x64
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            artifact: Windows-x64
          # Linux x86_64 (stable)
          - os: ubuntu-latest
            label: linux-x86_64
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            artifact: Linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version matches git tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          node scripts/check-version.mjs "$V"

      - name: Set version from package.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configure macOS signing mode
        if: runner.os == 'macOS'
        shell: bash
        env:
          MODE: ${{ env.MACOS_SIGNING_MODE }}
        run: |
          set -euo pipefail
          case "$MODE" in
            adhoc)
              echo "Using macOS ad-hoc signing (not Developer ID signed or notarized)"
              echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
              ;;
            developer-id)
              echo "Using Apple Developer ID signing and notarization"
              ;;
            *)
              echo "::error::Unknown MACOS_SIGNING_MODE: $MODE"
              exit 1
              ;;
          esac

      - name: Require Developer ID and notarization credentials
        if: runner.os == 'macOS' && env.MACOS_SIGNING_MODE == 'developer-id'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY_SECRET APPLE_ID APPLE_PASSWORD \
            APPLE_TEAM_ID KEYCHAIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required when MACOS_SIGNING_MODE=developer-id"
              exit 1
            fi
          done
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_SECRET" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && env.MACOS_SIGNING_MODE == 'developer-id'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/lattice-signing.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/lattice-developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "$APPLE_SIGNING_IDENTITY"
          echo "APPLE_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Install Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Install npm deps
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build:ui

      - name: Build Pi sidecar
        shell: bash
        run: bash scripts/build-pi-sidecar.sh "${{ matrix.platform }}"

      - name: Tauri build and packaging (non-macOS)
        if: runner.os != 'macOS'
        run: npx tauri build --config poc/tauri-app/src-tauri/tauri.conf.json --target "${{ matrix.target }}"

      - name: Tauri build, ad-hoc signing, and packaging (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING_MODE == 'adhoc'
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: npx tauri build --config poc/tauri-app/src-tauri/tauri.conf.json --target "${{ matrix.target }}"

      - name: Tauri build, Developer ID signing, notarization, and packaging (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING_MODE == 'developer-id'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: npx tauri build --config poc/tauri-app/src-tauri/tauri.conf.json --target "${{ matrix.target }}"

      - name: Verify ad-hoc macOS signature and packaged DMG
        if: runner.os == 'macOS' && env.MACOS_SIGNING_MODE == 'adhoc'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="poc/tauri-app/src-tauri/target/${{ matrix.target }}/release/bundle"
          APP="$BUNDLE/macos/Lattice.app"
          DMG=$(find "$BUNDLE/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
          test -d "$APP"
          test -n "$DMG"
          bash scripts/verify-macos-signing.sh "$APP" "$DMG"

      - name: Verify Developer ID signature, notarization, and packaged DMG
        if: runner.os == 'macOS' && env.MACOS_SIGNING_MODE == 'developer-id'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          BUNDLE="poc/tauri-app/src-tauri/target/${{ matrix.target }}/release/bundle"
          APP="$BUNDLE/macos/Lattice.app"
          DMG=$(find "$BUNDLE/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
          test -d "$APP"
          test -n "$DMG"
          bash scripts/verify-macos-signing.sh "$APP" "$DMG"

      - name: Collect + rename artifacts
        shell: bash
        run: |
          set -euo pipefail
          V="${VERSION}"
          A="${{ matrix.artifact }}"
          BUNDLE="poc/tauri-app/src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p dist-artifacts
          case "${{ matrix.platform }}" in
            darwin-*)
              cp "$BUNDLE"/dmg/*.dmg "dist-artifacts/Lattice-v${V}-${A}.dmg"
              ;;
            windows-*)
              cp "$BUNDLE"/nsis/*.exe "dist-artifacts/Lattice-v${V}-${A}.exe"
              ;;
            linux-*)
              cp "$BUNDLE"/appimage/*.AppImage "dist-artifacts/Lattice-v${V}-${A}.AppImage"
              cp "$BUNDLE"/deb/*.deb "dist-artifacts/Lattice-v${V}-${A}.deb"
              ;;
          esac
          ls -la dist-artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: lattice-stable-${{ matrix.label }}
          path: dist-artifacts/*
          if-no-files-found: error

      - name: Remove temporary signing keychain
        if: ${{ always() && runner.os == 'macOS' && env.MACOS_SIGNING_MODE == 'developer-id' }}
        shell: bash
        run: |
          if [ -n "${APPLE_KEYCHAIN:-}" ] && [ -f "$APPLE_KEYCHAIN" ]; then
            security delete-keychain "$APPLE_KEYCHAIN"
          fi

  # Experimental ARM64 cross-compile. Blocking release would require a real
  # ARM64 runner; these are non-blocking and clearly marked BUILD VERIFIED only.
  build-arm64:
    name: build-arm64 (${{ matrix.label }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-arm64
            platform: windows-arm64
            target: aarch64-pc-windows-msvc
            artifact: Windows-ARM64
          - os: ubuntu-latest
            label: linux-aarch64
            platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            artifact: Linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux ARM64 cross-compile deps
        if: matrix.label == 'linux-aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Install Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - name: Install npm deps
        run: npm ci --ignore-scripts
      - name: Build frontend
        run: npm run build:ui
      - name: Build Pi sidecar
        shell: bash
        run: bash scripts/build-pi-sidecar.sh "${{ matrix.platform }}"
      - name: Tauri build
        run: npx tauri build --config poc/tauri-app/src-tauri/tauri.conf.json --target "${{ matrix.target }}"
      - name: Collect artifacts (if produced)
        shell: bash
        continue-on-error: true
        run: |
          V="$(node -p 'require("./package.json").version')"
          A="${{ matrix.artifact }}"
          BUNDLE="poc/tauri-app/src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p dist-artifacts
          case "${{ matrix.platform }}" in
            windows-*) cp "$BUNDLE"/nsis/*.exe "dist-artifacts/Lattice-v${V}-${A}.exe" 2>/dev/null || true ;;
            linux-*) cp "$BUNDLE"/appimage/*.AppImage "dist-artifacts/Lattice-v${V}-${A}.AppImage" 2>/dev/null || true ;;
          esac
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lattice-experimental-${{ matrix.label }}
          path: dist-artifacts/*
          if-no-files-found: ignore

  release:
    name: create release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download stable artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lattice-stable-*
          path: artifacts
          merge-multiple: true

      - name: Generate release-wide checksum manifest
        run: |
          set -euo pipefail
          cd artifacts
          V="${GITHUB_REF_NAME}"
          for asset in \
            "Lattice-${V}-macOS-Apple-Silicon.dmg" \
            "Lattice-${V}-macOS-Intel.dmg" \
            "Lattice-${V}-Windows-x64.exe" \
            "Lattice-${V}-Linux-x86_64.AppImage" \
            "Lattice-${V}-Linux-x86_64.deb"; do
            test -f "$asset" || { echo "::error::Missing stable release asset: $asset"; exit 1; }
          done
          sha256sum Lattice-* > SHA256SUMS
          test "$(wc -l < SHA256SUMS | tr -d ' ')" -eq 5
          cat SHA256SUMS

      - name: List artifacts
        run: ls -la artifacts/

      - name: Prepare truthful release notes
        shell: bash
        env:
          MODE: ${{ env.MACOS_SIGNING_MODE }}
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<EOF
          ## Downloads

          | Platform | Device | Download |
          |---|---|---|
          | macOS | Apple Silicon | \`Lattice-${GITHUB_REF_NAME}-macOS-Apple-Silicon.dmg\` |
          | macOS | Intel | \`Lattice-${GITHUB_REF_NAME}-macOS-Intel.dmg\` |
          | Windows | x64 | \`Lattice-${GITHUB_REF_NAME}-Windows-x64.exe\` |
          | Linux | x86_64 | \`Lattice-${GITHUB_REF_NAME}-Linux-x86_64.AppImage\` / \`.deb\` |

          ## macOS signing status
          EOF
          case "$MODE" in
            adhoc)
              cat >> RELEASE_NOTES.md <<'EOF'

          These macOS builds are **ad-hoc signed** for GitHub Release and
          development/internal testing. They are **not Apple Developer ID
          signed or notarized**. macOS Gatekeeper may require manual approval
          on first launch: in Finder, right-click Lattice and choose **Open**,
          or use **System Settings → Privacy & Security → Open Anyway**.
          EOF
              ;;
            developer-id)
              cat >> RELEASE_NOTES.md <<'EOF'

          These macOS builds are signed with Apple Developer ID, notarized, and
          stapled. The release workflow verified the final packaged apps.
          EOF
              ;;
            *) echo "::error::Unknown MACOS_SIGNING_MODE: $MODE"; exit 1 ;;
          esac
          cat >> RELEASE_NOTES.md <<'EOF'

          Desktop release only. Android/iOS build issues are tracked separately.
          Windows/Linux ARM64 builds remain experimental and are not included
          in the production downloads; see `docs/PLATFORM_SUPPORT.md`.
          EOF
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Lattice ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
