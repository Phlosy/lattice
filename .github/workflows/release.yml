name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - os: macos-14
            label: macos-apple-silicon
            platform: darwin-arm64
            target: aarch64-apple-darwin
            artifact: macOS-Apple-Silicon
          - os: macos-14
            label: macos-intel
            platform: darwin-x64
            target: x86_64-apple-darwin
            artifact: macOS-Intel
          # Windows x64 (stable)
          - os: windows-latest
            label: windows-x64
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            artifact: Windows-x64
          # Linux x86_64 (stable)
          - os: ubuntu-latest
            label: linux-x86_64
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            artifact: Linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version matches git tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          node scripts/check-version.mjs "$V"

      - name: Set version from package.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Install npm deps
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build:ui

      - name: Build Pi sidecar
        shell: bash
        run: bash scripts/build-pi-sidecar.sh "${{ matrix.platform }}"

      - name: Tauri build
        run: npx tauri build --config poc/tauri-app/src-tauri/tauri.conf.json --target "${{ matrix.target }}"

      - name: Collect + rename artifacts
        shell: bash
        run: |
          set -euo pipefail
          V="${VERSION}"
          A="${{ matrix.artifact }}"
          BUNDLE="poc/tauri-app/src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p dist-artifacts
          case "${{ matrix.platform }}" in
            darwin-*)
              cp "$BUNDLE"/dmg/*.dmg "dist-artifacts/Lattice-v${V}-${A}.dmg"
              ;;
            windows-*)
              cp "$BUNDLE"/nsis/*.exe "dist-artifacts/Lattice-v${V}-${A}.exe"
              ;;
            linux-*)
              cp "$BUNDLE"/appimage/*.AppImage "dist-artifacts/Lattice-v${V}-${A}.AppImage"
              cp "$BUNDLE"/deb/*.deb "dist-artifacts/Lattice-v${V}-${A}.deb" 2>/dev/null || true
              ;;
          esac
          ls -la dist-artifacts/

      - name: Checksum
        shell: bash
        run: |
          cd dist-artifacts
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS
          else
            shasum -a 256 * > SHA256SUMS
          fi
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: lattice-${{ matrix.label }}
          path: dist-artifacts/*
          if-no-files-found: error

  # Experimental ARM64 cross-compile. Blocking release would require a real
  # ARM64 runner; these are non-blocking and clearly marked BUILD VERIFIED only.
  build-arm64:
    name: build-arm64 (${{ matrix.label }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-arm64
            platform: windows-arm64
            target: aarch64-pc-windows-msvc
            artifact: Windows-ARM64
          - os: ubuntu-latest
            label: linux-aarch64
            platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            artifact: Linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux ARM64 cross-compile deps
        if: matrix.label == 'linux-aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Install Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - name: Install npm deps
        run: npm ci --ignore-scripts
      - name: Build frontend
        run: npm run build:ui
      - name: Build Pi sidecar
        shell: bash
        run: bash scripts/build-pi-sidecar.sh "${{ matrix.platform }}"
      - name: Tauri build
        run: npx tauri build --config poc/tauri-app/src-tauri/tauri.conf.json --target "${{ matrix.target }}"
      - name: Collect artifacts (if produced)
        shell: bash
        continue-on-error: true
        run: |
          V="$(node -p 'require("./package.json").version')"
          A="${{ matrix.artifact }}"
          BUNDLE="poc/tauri-app/src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p dist-artifacts
          case "${{ matrix.platform }}" in
            windows-*) cp "$BUNDLE"/nsis/*.exe "dist-artifacts/Lattice-v${V}-${A}.exe" 2>/dev/null || true ;;
            linux-*) cp "$BUNDLE"/appimage/*.AppImage "dist-artifacts/Lattice-v${V}-${A}.AppImage" 2>/dev/null || true ;;
          esac
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lattice-${{ matrix.label }}
          path: dist-artifacts/*
          if-no-files-found: ignore

  release:
    name: create release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/ 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Lattice ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | Device | Download |
            |---|---|---|
            | macOS | Apple Silicon | `Lattice-${{ github.ref_name }}-macOS-Apple-Silicon.dmg` |
            | macOS | Intel | `Lattice-${{ github.ref_name }}-macOS-Intel.dmg` |
            | Windows | x64 | `Lattice-${{ github.ref_name }}-Windows-x64.exe` |
            | Linux | x86_64 | `Lattice-${{ github.ref_name }}-Linux-x86_64.AppImage` / `.deb` |

            ARM64 (Windows / Linux) is cross-compiled but not runtime-verified;
            see `docs/PLATFORM_SUPPORT.md`.
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
