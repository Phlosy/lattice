name: mobile-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ios-check:
    name: iOS compile check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: poc/tauri-app/src-tauri

      - name: Install npm deps
        run: npm ci --ignore-scripts

      - name: Mobile typecheck + build
        run: |
          npm run typecheck
          npm run build:ui
          mkdir -p poc/tauri-app/src-tauri/pi-sidecar

      - name: Diagnose Xcode toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --show-sdk-path --sdk iphoneos 2>&1 || echo "iphoneos SDK not found"

      - name: Rust compile check (iOS device + simulator)
        working-directory: poc/tauri-app/src-tauri
        run: |
          set +e
          cargo check --target aarch64-apple-ios --message-format=short > /tmp/ios.log 2>&1
          RC=$?
          cat /tmp/ios.log
          if [ $RC -ne 0 ]; then
            echo "::error file=ios-check::$(tail -5 /tmp/ios.log | tr '\n' ' ' | head -c 3000)"
          fi
          exit $RC

  android-check:
    name: Android compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Linux system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Install npm deps
        run: npm ci --ignore-scripts

      - name: Prepare Tauri build artifacts (frontendDist + resources)
        run: |
          npm run build:ui
          mkdir -p poc/tauri-app/src-tauri/pi-sidecar

      - name: Rust compile check (Android)
        working-directory: poc/tauri-app/src-tauri
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          NDK=$(ls "$ANDROID_HOME/ndk" 2>/dev/null | head -1)
          echo "NDK=$NDK"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK"
          set +e
          cargo check --target aarch64-linux-android --message-format=short > /tmp/android.log 2>&1
          RC=$?
          cat /tmp/android.log
          {
            echo "## Android cargo check (exit $RC)"
            echo '```'
            tail -50 /tmp/android.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC
