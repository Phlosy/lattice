<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lattice Tauri PoC</title>
    <style>
      body { font-family: -apple-system, sans-serif; margin: 0; background: #0f1014; color: #e6e6ea; display: flex; height: 100vh; }
      #sidebar { width: 220px; border-right: 1px solid #26272e; display: flex; flex-direction: column; }
      #sidebar .ws-head { padding: 12px; border-bottom: 1px solid #26272e; font-weight: 600; font-size: 13px; }
      #files { flex: 1; overflow-y: auto; padding: 4px; }
      .file { padding: 4px 8px; font-family: monospace; font-size: 12px; cursor: pointer; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .file:hover { background: #26272e; }
      #main { flex: 1; display: flex; flex-direction: column; }
      #viewer { flex: 1; overflow: auto; padding: 12px; font-family: monospace; font-size: 12px; white-space: pre; border-bottom: 1px solid #26272e; }
      #prompt-bar { display: flex; gap: 8px; padding: 12px; }
      #output { flex: 1; overflow-y: auto; padding: 12px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
      #controls { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #26272e; }
      input, button { background: #1a1b20; border: 1px solid #33343c; color: #e6e6ea; border-radius: 6px; padding: 8px 12px; font-size: 13px; }
      input { flex: 1; }
      button { cursor: pointer; }
      button:hover { background: #34353c; }
      #send { background: #6ea8fe; color: #0f1014; border-color: #6ea8fe; font-weight: 600; }
      .label { font-size: 11px; color: #6f6f7a; padding: 8px 8px 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <div class="ws-head" id="ws-name">No project</div>
      <div class="label">Files</div>
      <div id="files"></div>
    </div>
    <div id="main">
      <div id="prompt-bar">
        <input id="path" placeholder="/path/to/project" />
        <button id="open">Open</button>
      </div>
      <div id="viewer">Select a file to view its contents.</div>
      <div id="output"></div>
      <div id="controls">
        <input id="input" placeholder="Ask the Pi sidecar…" />
        <button id="send">Send</button>
        <button id="abort">Abort</button>
        <button id="crash">Crash</button>
      </div>
    </div>
    <script src="./main.js"></script>
  </body>
</html>
