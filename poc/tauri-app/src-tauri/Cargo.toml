[package]
name = "poctauri-app"
version = "1.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "poctauri-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "poctauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop-only: portable-pty (termios/ioctl) and the Runtime Host (tokio WSS)
# do not build on iOS/Android. Mobile is a Remote Runtime Client.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
portable-pty = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

[[bin]]
name = "lattice-runtime"
path = "src/bin/lattice-runtime.rs"

