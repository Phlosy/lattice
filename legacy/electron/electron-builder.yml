{
  "appId": "dev.lattice.desktop",
  "productName": "Lattice",
  "directories": {
    "output": "release",
    "buildResources": "resources"
  },
  "files": [
    "out/**/*",
    "!**/*.map",
    "!node_modules/@earendil-works/pi-coding-agent/docs/**",
    "!node_modules/@earendil-works/pi-coding-agent/examples/**",
    "!node_modules/@earendil-works/pi-coding-agent/CHANGELOG.md",
    "!node_modules/@earendil-works/pi-coding-agent/README.md",
    "!node_modules/@mariozechner/**"
  ],
  "asarUnpack": [
    "**/*.node",
    "node_modules/node-pty/**/*",
    "node_modules/@earendil-works/**/*",
    "node_modules/@silvia-odwyer/**/*"
  ],
  "mac": {
    "target": [
      "dmg",
      "zip"
    ],
    "category": "public.app-category.developer-tools",
    "artifactName": "${productName}-${version}-${arch}.${ext}"
  },
  "win": {
    "target": [
      "nsis"
    ],
    "artifactName": "${productName}-${version}-${arch}.${ext}"
  },
  "linux": {
    "target": [
      "AppImage",
      "deb"
    ],
    "category": "Development",
    "artifactName": "${productName}-${version}-${arch}.${ext}"
  },
  "nsis": {
    "oneClick": false,
    "allowToChangeInstallationDirectory": true
  },
  "electronLanguages": [
    "en",
    "zh-CN",
    "zh-TW"
  ]
}
